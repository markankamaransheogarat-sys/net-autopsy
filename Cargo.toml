[package]
name = "net-autopsy"
version = "0.1.0"
edition = "2021"
authors = ["markankamaransheogarat-sys <markankamaransheogarat@users.noreply.github.com>"]
description = "High-Precision Network Forensics & Censorship Autopsy Engine (OSI Layers 3-7) in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/markankamaransheogarat-sys/net-autopsy"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = "0.6"
bytes = "1.6"

[dev-dependencies]
tokio-test = "0.4"
